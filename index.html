<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>יוצאים לדרך · שבת מחוץ לשגרה</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#faf8f2;color:#252a26;font:17px/1.7 Arial,sans-serif}a{color:inherit}button{font:inherit;cursor:pointer}nav{height:77px;max-width:1060px;margin:auto;padding:0 32px;display:flex;align-items:center;justify-content:space-between}.brand{text-decoration:none;font-size:23px;font-weight:800;letter-spacing:-1px}.brand span{color:#c35d39}.navlinks{display:flex;gap:23px;font-size:13px}.navlinks a{text-decoration:none;color:#75786f}main{max-width:1060px;margin:auto;padding:0 32px 45px}.hero{height:500px;position:relative;overflow:hidden;border-radius:8px;background:#687861}.hero>img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}.hero:after{content:'';position:absolute;inset:0;background:linear-gradient(0deg,#0d1c15dc,#0d1c1508 85%)}.herotext{position:absolute;bottom:38px;right:40px;left:35px;color:white;z-index:1}.kicker{font-size:12px;letter-spacing:1.4px;color:#f6ceae}.herotext h1{font-size:clamp(45px,6.5vw,77px);letter-spacing:-2.4px;line-height:1.06;margin:13px 0 17px}.herotext p{font-size:18px;margin:0}.stamp{position:absolute;top:23px;right:24px;z-index:1;background:#faf8f2ef;color:#343b30;padding:6px 12px;border-radius:4px;font-size:12px}.credit{font-size:10px;color:#87877d;margin:5px 0 10px}.strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px;margin-top:16px}figure{margin:0}.photo{display:block;padding:0;border:0;width:100%;background:#e5e8dd;border-radius:6px;overflow:hidden}.photo img{display:block;width:100%;height:182px;object-fit:cover}figcaption{font-size:11px;margin-top:7px;color:#5b6258}.tripintro{padding:25px 0 30px;border-bottom:1px solid #dedfd4}.eyebrow{color:#a85134;font-size:11px;font-weight:bold}.tripintro h2{font-size:clamp(26px,4vw,37px);line-height:1.25;margin:7px 0 10px}.tripintro p{max-width:730px;color:#6b7167;font-size:15px}.chips{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.chips span{border:1px solid #dcded3;padding:4px 11px;border-radius:20px;font-size:12px}.btn{display:inline-flex;align-items:center;text-decoration:none;background:#bf603e;color:white;padding:12px 22px;border:0;border-radius:5px;font-size:14px;margin:8px 0 0 7px}.secondary{background:#e8ebdf;color:#34402f}.section-title{display:flex;justify-content:space-between;align-items:baseline;margin:33px 0 15px}.section-title h2{font-size:26px;margin:0}.section-title span,.small{font-size:12px;color:#727b69}.archive{display:block;border:1px solid #e2e3d9;border-radius:7px;background:#fffefb;padding:22px 25px;text-decoration:none;margin:12px 0}.archive h3{font-size:22px;margin:7px 0}.archive p{font-size:14px;color:#737b6d;margin:0}.archive img{width:170px;height:125px;object-fit:cover;border-radius:5px;float:left;margin:0 20px 10px 0}.archive:after{content:'';display:block;clear:both}.practical{font-size:13px;margin:24px 0;background:#f2eddf;border-right:2px solid #c19259;padding:12px 16px;border-radius:3px}summary{cursor:pointer}footer{margin-top:35px;border-top:1px solid #e1e2d8;padding-top:17px;font-size:11px;color:#777c70}.back{display:inline-block;margin:20px 0;text-decoration:none;font-size:13px;color:#a35436}.routetitle{font-size:clamp(32px,5vw,49px);line-height:1.15;margin:10px 0 20px}.routebanner{height:330px;width:100%;object-fit:cover;border-radius:7px}.routebar{border-bottom:1px solid #dcdfd3;padding:18px 0;display:flex;gap:13px;flex-wrap:wrap;font-size:14px}.routebar a{text-decoration:none}.routebar b,.stophead b{color:#ba603e}.stop{padding:28px 0;border-bottom:1px solid #dfe2d6;scroll-margin-top:20px}.stophead{display:flex;gap:16px;align-items:baseline}.stophead b{font-size:32px}.stop h2{margin:0;font-size:27px}.stop p{font-size:15px;color:#687360;max-width:800px}.gallery{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:19px 0}.gallery .photo img{height:190px}.review{padding:24px;background:#edf0e5;border-radius:6px;margin:23px 0}.review h2{margin-top:0}.review p,.review li{font-size:14px}.reviewcols{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}.review h3{font-size:15px}.review ul{padding-right:17px}dialog{border:0;padding:12px;border-radius:9px;background:#faf8f2;max-width:95vw}dialog::backdrop{background:#000d}dialog img{max-width:88vw;max-height:78vh;display:block}dialog button{border:0;background:#303f31;color:white;padding:8px 15px;margin-bottom:10px}.mapwrap{margin:25px 0;border:1px solid #dce1d3;border-radius:9px;overflow:hidden}.mapintro{padding:17px 20px;background:#f0f2e8}.mapintro h2{margin:0;font-size:25px}.tripmap{height:350px;direction:ltr;background:#e7ebdf}.maplist{padding:15px 20px}.maplist ol{margin:0;padding-right:22px;font-size:14px}.maplist li{padding:4px}.pin span{display:flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;background:#b95131;border:2px solid white;color:white;font-weight:bold;box-shadow:0 2px 6px #0005}.leaflet-popup-content{direction:rtl;text-align:right}.leaflet-control-attribution{font-size:10px}.status{font-size:12px}@media(max-width:650px){nav{height:66px;padding:0 19px}.brand{font-size:21px}.navlinks{gap:14px;font-size:11px}main{padding:0 17px 30px}.hero{height:420px;border-radius:5px}.herotext{right:24px;left:22px;bottom:29px}.herotext h1{font-size:51px;letter-spacing:-1.6px}.herotext p{font-size:15px}.stamp{top:18px;right:18px;font-size:11px}.strip{grid-template-columns:1fr 1fr;gap:10px;margin-top:11px}.strip figure:last-child{display:none}.strip .photo img{height:150px}.tripintro{padding:20px 0 25px}.tripintro h2{font-size:28px}.tripintro p{font-size:14px}.section-title h2{font-size:23px}.archive{padding:18px}.archive h3{font-size:20px}.archive img{width:105px;height:95px}.gallery{grid-template-columns:1fr 1fr;gap:10px}.gallery .photo img{height:170px}.routebanner{height:230px}.stop h2{font-size:24px}.reviewcols{grid-template-columns:1fr;gap:3px}.tripmap{height:300px}}@media print{nav,.btn{display:none}.hero{height:350px}.photo img{height:130px}}</style></head><body><nav><a href="#" class="brand">יוצאים לדרך<span> ●</span></a><div class="navlinks"><a href="#">הטיול הבא</a><a href="#past">מהדרך</a></div></nav><main id="app" aria-live="polite"><p>טוענים את הטיולים…</p></main><dialog id="lightbox" aria-label="תמונה מוגדלת"><button id="close">סגירה ✕</button><img id="large" alt=""></dialog><script>let trips=[],mapInstance;const app=document.getElementById('app'),box=document.getElementById('lightbox');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const photos=t=>t.stops.flatMap(s=>s.photos||[]),url=t=>'#trip='+encodeURIComponent(t.id),date=t=>new Date(t.date+'T12:00:00').toLocaleDateString('he-IL',{day:'numeric',month:'long',year:'numeric'});const img=(p,lazy=true)=>p?`<img src="${esc(p.url)}" alt="${esc(p.caption)}" ${lazy?'loading="lazy"':'fetchpriority="high"'}>`:'';const fig=p=>`<figure><button class="photo" aria-label="הגדלת תמונה">${img(p)}</button><figcaption>${esc(p.caption)} · <a href="${esc(p.source)}" target="_blank" rel="noopener">מקור</a></figcaption></figure>`;const link=(u,t)=>`<a class="btn secondary" target="_blank" rel="noopener noreferrer" href="${esc(u)}">${esc(t)} ↗</a>`;function enrich(){const a=trips.find(t=>t.id==='2026-11-07-azekah-eretz-tova');if(a){a.stops[0].coords=[31.69999,34.936008];a.stops[1].coords=[31.7929276,34.9490835]}const g=trips.find(t=>t.id==='2026-10-31-gibton-and-surroundings');if(g){g.stops[1].coords=[31.85399,34.86584];g.stops[2].coords=[31.8343741,34.865487];g.stops[3].coords=[31.9285438,34.8799707];g.stops[1].photos=[{url:'https://d2u1z1lopyfwlx.cloudfront.net/thumbnails/1a473eb5-484d-58f8-952f-53deabb5a20b/d319a420-89d4-5d9a-b0e5-c004fceb21d2.jpg',caption:'השביל המוגבה במעיינות גיבתון',source:'https://www.parks.org.il/reserve-park/m-gibton/'},{url:'https://d2u1z1lopyfwlx.cloudfront.net/thumbnails/a1002dbd-9e8e-53c2-9b9f-775b4e2a43da/bfc8b3fb-df3f-579b-adb7-fc7e06e93860.jpg',caption:'גשר בין הקנים בגיבתון',source:'https://baliletayel.co.il/israeltrip/שמורת-מעיינות-גיבתון-תל-מילוט/'}];g.stops[2].photos=[{url:'https://d2u1z1lopyfwlx.cloudfront.net/thumbnails/7f39e9d0-cc49-5ef0-921d-9c1d0ff3726a/bfc8b3fb-df3f-579b-adb7-fc7e06e93860.jpg',caption:'מינה טראק בחולדה',source:'https://baliletayel.co.il/rest/מינה-טראק-עגלת-קפה-בתוך-יער-חולדה/'}];g.stops[3].photos=[{url:'https://d2u1z1lopyfwlx.cloudfront.net/thumbnails/73877e1b-20f0-503d-a117-747ef9a04b28/7ed9c5cc-6322-54c7-984d-e8b54d8b41e1.jpg',caption:'Kenworth T-800 באוסף המוזיאון',source:'https://trucksmuseum.org.il/2025/03/04/kenworth-t-800-1988/'},{url:'https://d2u1z1lopyfwlx.cloudfront.net/thumbnails/4dc6bf73-a681-556e-ad9c-47a2e79084da/7ed9c5cc-6322-54c7-984d-e8b54d8b41e1.jpg',caption:'Mack EH באוסף המוזיאון',source:'https://trucksmuseum.org.il/2025/02/26/mack-eh-1948/'}];g.notice='סיכום ביקור מ־31.10.2026, לא המלצת פתיחה עדכנית. בעת בדיקת המקורות נמצאו הודעות סגירה באתר המוזיאון וב־iNature לגבי גיבתון; תוקפן כיום לא הוכרע. יש לבדוק ישירות לפני ביקור חוזר. התמונות ממקורות חיצוניים ואינן צילומים מהביקור המתועד.'}}function fullroute(t){const q=new URLSearchParams({api:'1',origin:t.stops[0].map,destination:t.stops[t.stops.length-1].map,travelmode:'driving'});if(t.stops.length>2)q.set('waypoints',t.stops.slice(1,-1).map(s=>s.map).join('|'));return 'https://www.google.com/maps/dir/?'+q}function maphtml(t){return `<section class="mapwrap"><div class="mapintro"><h2>הטיול על המפה</h2><p class="small">מיקומי האתרים, לא חניונים או הוראות גישה. אין כאן קו נהיגה מחושב.</p></div><div id="tripmap" class="tripmap" role="region" aria-label="מפת תחנות הטיול"><p>טוענים מפה…</p></div><div class="maplist"><ol>${t.stops.map(s=>`<li>${esc(s.name)}${!s.coords?' — מיקום מדויק לא אומת; לא הוצבה סיכה':''}</li>`).join('')}</ol>${link(fullroute(t),'למסלול המלא ב־Google Maps')}<p class="small">התחנות נשמרות לפי סדר הביקור. Google Maps מחשב את הדרך; יש לבדוק כל יעד וחניה לפני היציאה.</p></div></section>`}let leafletPromise;function leaflet(){if(window.L)return Promise.resolve();if(!leafletPromise)leafletPromise=new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';s.onload=resolve;s.onerror=reject;document.head.appendChild(s)});return leafletPromise}async function mountmap(t){const el=document.getElementById('tripmap');if(!el)return;try{await leaflet();if(!el.isConnected)return;el.textContent='';const m=L.map(el,{scrollWheelZoom:false});mapInstance=m;L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'}).addTo(m);const pts=[];t.stops.forEach((s,i)=>{if(!s.coords)return;pts.push(s.coords);const popup=document.createElement('div'),title=document.createElement('strong'),a=document.createElement('a');title.textContent=(i+1)+'. '+s.name;a.textContent='פתיחת האתר במפות';a.href='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(s.map);a.target='_blank';a.rel='noopener';popup.append(title,document.createElement('br'),a);L.marker(s.coords,{icon:L.divIcon({className:'pin',html:'<span>'+(i+1)+'</span>',iconSize:[30,30],iconAnchor:[15,15]})}).addTo(m).bindPopup(popup)});if(pts.length)m.fitBounds(L.latLngBounds(pts),{padding:[35,35],maxZoom:14});else m.setView([31.85,34.9],10);setTimeout(()=>{if(el.isConnected)m.invalidateSize()},100)}catch(e){if(el.isConnected)el.textContent='המפה לא נטענה. אפשר לפתוח את המסלול המלא בכפתור למטה.'}}function footer(){return '<footer>יוצאים לדרך · רעיונות וסיכומים מהדרך.<details><summary>מקורות, מפות ותמונות</summary><p>תמונות ממקורות חיצוניים, לא צילומים מהביקור. רישיונות שימוש לא אומתו; יש להסדיר הרשאות או להשתמש בתמונות מורשות. התמונות אינן אישור לתפריט, עונה או מצב המקום.</p><p>מפות: Leaflet ו־OpenStreetMap. נקודות ציון: רישומי מקומות; גיבתון לפי iNature. סיכות הן מיקומי אתרים, לא חניות. המסלול המלא מחושב מחוץ לאתר ב־Google Maps.</p><p>יש לבדוק פתיחה, מזג אוויר, מחירים והנחיות סמוך ליציאה. סיכומי ביקור נשמרים במאגר; אין טופס שמירה אוטומטי.</p><a href="https://www.kkl.org.il/recreation-and-tours/messages/">הודעות קק״ל</a> · <a href="https://trucksmuseum.org.il/">אתר המוזיאון</a> · <a href="https://inature.info/wiki/שמורת_מעיינות_גיבתון">iNature גיבתון</a></details></footer>'}function card(t){return `<a class="archive" href="${url(t)}">${photos(t)[0]?img(photos(t)[0]):''}<span class="eyebrow">${esc(date(t))} · ${t.status==='completed'?'סיכום ביקור':'הצעה לטיול'}</span><h3>${esc(t.title)}</h3><p>${esc(t.summary)}</p></a>`}function home(){const next=trips.filter(t=>t.status==='proposed'),past=trips.filter(t=>t.status==='completed'),t=next[0];let h='';if(t){const p=photos(t),extra=t.stops.slice(1).flatMap(s=>s.photos||[]),strip=[...extra.slice(0,2),p[1]].filter(Boolean).slice(0,3);h=`<section class="hero">${img(p[0],false)}<div class="stamp">הצעה לטיול · ${esc(date(t))}</div><div class="herotext"><span class="kicker">קצת טבע. משהו מפתיע. יום טוב.</span><h1>שבת מחוץ<br>לשגרה.</h1><p>${esc(t.title)}</p></div></section>${p[0]?`<p class="credit"><a href="${esc(p[0].source)}" target="_blank" rel="noopener">מקור תמונת הנוף</a> · התמונה מעונה אחרת</p>`:''}<div class="strip">${strip.map(fig).join('')}</div><section class="tripintro"><span class="eyebrow">הטיול הבא</span><h2>${esc(t.title)}</h2><p>${esc(t.summary)}</p><div class="chips"><span>${t.stops.length} תחנות</span><span>מפה וניווט</span><span>טיול עצמאי</span></div><a class="btn" href="${url(t)}">בואו נראה את התוכנית ←</a></section>${t.notice?`<details class="practical"><summary>פרטים שדורשים אישור</summary><p>${esc(t.notice)}</p></details>`:''}`}return h+next.slice(1).map(card).join('')+'<div class="section-title" id="past"><h2>טיולים קודמים</h2><span>מסלולים, מפות וחוויות</span></div>'+past.map(card).join('')+footer()}function review(t){if(!t.review)return '<section class="review"><h2>אחרי שחוזרים</h2><p>טרם נוסף סיכום ביקור. זו תוכנית מוצעת.</p></section>';const r=t.review;return `<section class="review"><h2>איך היה בפועל?</h2><p>${esc(r.summary)}</p><div class="reviewcols"><div><h3>מה עבד</h3><ul>${r.worked.map(x=>'<li>'+esc(x)+'</li>').join('')}</ul></div><div><h3>מה פחות עבד</h3><p>${esc(r.improve||'טרם נמסר.')}</p></div><div><h3>לפעם הבאה</h3><p>${esc(r.next||'טרם נמסר.')}</p></div></div></section>`}function render(){if(mapInstance){mapInstance.remove();mapInstance=null}const hash=location.hash.slice(1),id=new URLSearchParams(hash).get('trip'),alias={azekah:'2026-11-07-azekah-eretz-tova',gibton:'2026-10-31-gibton-and-surroundings'},t=trips.find(x=>x.id===(id||alias[hash]));if(!id&&!alias[hash]){document.title='יוצאים לדרך · שבת מחוץ לשגרה';app.innerHTML=home();bind();if(hash==='past')requestAnimationFrame(()=>document.getElementById('past')?.scrollIntoView());return}if(!t){app.innerHTML='<h1>הטיול לא נמצא</h1><a href="#">חזרה</a>';return}document.title=t.title+' · יוצאים לדרך';app.innerHTML=`<a class="back" href="#">→ חזרה לכל הטיולים</a><div class="eyebrow">${esc(date(t))} · ${t.status==='completed'?'סיכום ביקור':'הצעה לטיול'}</div><h1 class="routetitle">${esc(t.title)}</h1><p>${esc(t.summary)}</p>${photos(t)[0]?img(photos(t)[0],false).replace('<img ','<img class="routebanner" '):''}${maphtml(t)}${t.notice?`<aside class="practical">${esc(t.notice)}</aside>`:''}<div class="routebar">${t.stops.map((s,i)=>`<a href="#stop-${i}" data-stop="stop-${i}"><b>${i+1}</b> ${esc(s.name)}</a>`).join('')}</div>${t.stops.map((s,i)=>`<section class="stop" id="stop-${i}"><div class="stophead"><b>${String(i+1).padStart(2,'0')}</b><h2>${esc(s.name)}</h2></div><p>${esc(s.description)}</p>${s.duration?`<p class="small">${esc(s.duration)}</p>`:''}${s.photos?.length?'<div class="gallery">'+s.photos.map(fig).join('')+'</div>':'<p class="small">טרם נוספו תמונות מזוהות מתאימות לתחנה הזו.</p>'}${link('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(s.map),'ניווט')}${s.website?link(s.website,'אתר המקום'):''}</section>`).join('')}${t.transfers?.length?'<p class="small">'+t.transfers.map(esc).join('<br>')+' · הערכות בלבד.</p>':''}${review(t)}<button class="btn" id="share">שיתוף הטיול ↗</button><span id="status" class="status"></span>${footer()}`;bind();mountmap(t);document.querySelectorAll('[data-stop]').forEach(a=>a.onclick=e=>{e.preventDefault();document.getElementById(a.dataset.stop).scrollIntoView({behavior:'smooth'})});document.getElementById('share').onclick=async()=>{try{if(navigator.share)await navigator.share({title:t.title,url:location.href});else{await navigator.clipboard.writeText(location.href);document.getElementById('status').textContent=' הקישור הועתק'}}catch(e){if(e.name!=='AbortError')document.getElementById('status').textContent=' אפשר להעתיק את הקישור ידנית'}}}function bind(){document.querySelectorAll('.photo').forEach(b=>b.onclick=()=>{const i=b.querySelector('img');if(!i||i.hidden)return;const l=document.getElementById('large');l.src=i.src;l.alt=i.alt;box.showModal()});document.querySelectorAll('#app img').forEach(i=>i.addEventListener('error',()=>{i.hidden=true;const p=document.createElement('span');p.className='small';p.textContent='התמונה אינה זמינה כרגע';i.after(p)}))}document.getElementById('close').onclick=()=>box.close();box.onclick=e=>{if(e.target===box)box.close()};addEventListener('hashchange',()=>{render();if(location.hash!=='#past')scrollTo(0,0)});fetch('data/trips.json').then(r=>{if(!r.ok)throw Error('load');return r.json()}).then(d=>{trips=d.trips;enrich();render()}).catch(()=>{app.innerHTML='<h1>לא ניתן לטעון את הטיולים</h1><p>נסו לרענן. לפתיחה מקומית נדרש שרת HTTP.</p>'});</script></body></html>
