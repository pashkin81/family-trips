<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>יוצאים לדרך · טיולים ורעיונות</title><meta name="description" content="רעיונות לטיולים עצמאיים, גלריות, ניווט וסיכומי ביקור"><style>*{box-sizing:border-box}body{margin:0;background:#f6f2e9;color:#254238;font:17px/1.7 Arial,sans-serif}main{max-width:1000px;margin:auto;padding:28px 20px 60px}header{background:#254238;color:#fff;padding:55px 25px;border-radius:0 0 30px 30px}header div{max-width:960px;margin:auto}h1{font-size:clamp(34px,6vw,60px);line-height:1.2;margin:10px 0}h2{line-height:1.3}.grid,.gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.card,.panel{background:white;border-radius:22px;padding:25px;margin:20px 0}.card{margin:0}.tag{font-size:13px;color:#81613e}.btn{display:inline-block;background:#254238;color:white;border:0;border-radius:10px;padding:10px 16px;text-decoration:none;margin:8px 0 0 8px;font:inherit;cursor:pointer}.secondary{background:#e5ebdf;color:#254238}.notice{background:#fff0d5;padding:17px;border-radius:13px;margin:20px 0}.small,figcaption,footer{font-size:13px;color:#68776b}a{color:inherit}figure{margin:0}.photo{padding:0;border:0;background:none;width:100%;cursor:zoom-in}.photo img{width:100%;height:230px;object-fit:cover;border-radius:14px;display:block}figcaption{padding:5px 0}.chips{display:flex;gap:9px;flex-wrap:wrap}.chips span{border:1px solid #d4ddcf;border-radius:25px;padding:5px 12px}footer{border-top:1px solid #d5ddce;padding-top:22px;margin-top:30px}dialog{border:0;border-radius:15px;background:#f6f2e9;padding:12px;max-width:95vw}dialog::backdrop{background:#000c}dialog img{max-width:85vw;max-height:78vh;display:block}dialog button{margin-bottom:10px}@media(max-width:600px){.grid{grid-template-columns:1fr}.gallery{gap:10px}.photo img{height:160px}.panel{padding:19px}main{padding:22px 14px}}@media print{header{padding:20px}.btn{display:none}}</style></head><body><header><div><span>טיולים עצמאיים · רעיונות · חוויות מהדרך</span><h1>יוצאים לדרך</h1><p>מקומות מעניינים, תוכניות גמישות וסיכומים שעוזרים לתכנן את הפעם הבאה.</p></div></header><main id="app"><p>טוענים את הטיולים…</p></main><dialog id="viewer"><button class="btn" id="close">סגירה ✕</button><img id="large" alt=""></dialog><script>const app=document.getElementById('app');let trips=[];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const link=(u,t)=>`<a class="btn" target="_blank" rel="noopener noreferrer" href="${esc(u)}">${esc(t)} ↗</a>`;function cards(items){return items.length?'<div class="grid">'+items.map(t=>`<article class="card"><span class="tag">${esc(t.date)} · ${t.status==='completed'?'בוצע':'הצעה'}</span><h2>${esc(t.title)}</h2><p>${esc(t.summary)}</p><a class="btn" href="#trip=${encodeURIComponent(t.id)}">למסלול ולתמונות</a></article>`).join('')+'</div>':'<p>אין טיולים להצגה.</p>'}function render(){const id=new URLSearchParams(location.hash.slice(1)).get('trip');const t=trips.find(x=>x.id===id);if(!id){app.innerHTML='<h2>רעיונות לטיול הבא</h2>'+cards(trips.filter(t=>t.status==='proposed'))+'<h2>טיולים שכבר בוצעו</h2>'+cards(trips.filter(t=>t.status==='completed'))+foot();return}if(!t){app.innerHTML='<h2>הטיול לא נמצא</h2><a href="#">חזרה לארכיון</a>';return}app.innerHTML=`<a href="#">← לכל הטיולים</a><p class="tag">${esc(t.date)} · ${t.status==='completed'?'סיכום ביקור':'תוכנית מוצעת'}</p><h1>${esc(t.title)}</h1><p>${esc(t.summary)}</p>${t.notice?`<div class="notice">${esc(t.notice)}</div>`:''}${t.stops.map((s,i)=>`<section class="panel"><span class="tag">תחנה ${i+1}</span><h2>${esc(s.name)}</h2><p>${esc(s.description)}</p>${s.duration?`<p class="small">${esc(s.duration)}</p>`:''}${link('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(s.map),'ניווט')}${s.website?link(s.website,'אתר המקום'):''}${s.photos?.length?'<div class="gallery">'+s.photos.map(p=>`<figure><button class="photo" type="button" aria-label="הגדלת תמונה"><img loading="lazy" src="${esc(p.url)}" alt="${esc(p.caption)}"></button><figcaption>${esc(p.caption)} · <a target="_blank" rel="noopener noreferrer" href="${esc(p.source)}">מקור</a></figcaption></figure>`).join('')+'</div>':''}</section>`).join('')}${t.transfers?.length?'<section class="panel"><h2>מעברים</h2><ul>'+t.transfers.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul><p class="small">הערכות בלבד, לא חישוב ניווט או תנועה בזמן אמת.</p></section>':''}<section class="panel"><h2>סיכום וביקורת</h2>${t.review?`<p>${esc(t.review.summary)}</p><h3>מה עבד</h3><ul>${t.review.worked.map(x=>'<li>'+esc(x)+'</li>').join('')}</ul><h3>מה פחות עבד</h3><p>${esc(t.review.improve||'לא נמסר מידע.')}</p><h3>לפעם הבאה</h3><p>${esc(t.review.next||'טרם נוספו המלצות נוספות.')}</p>`:'<p>טרם נוסף סיכום ביקור. התוכנית אינה עדות לכך שהטיול בוצע.</p>'}</section><button class="btn" id="share">שיתוף הטיול</button><span id="share-status" class="small"></span>${foot()}`;document.querySelectorAll('.photo').forEach(b=>b.onclick=()=>{const im=b.querySelector('img'),l=document.getElementById('large');l.src=im.src;l.alt=im.alt;document.getElementById('viewer').showModal()});document.getElementById('share').onclick=async()=>{try{if(navigator.share)await navigator.share({title:t.title,url:location.href});else{await navigator.clipboard.writeText(location.href);document.getElementById('share-status').textContent=' הקישור הועתק'}}catch(e){document.getElementById('share-status').textContent=' אפשר להעתיק את כתובת הדף ידנית'}}}function foot(){return '<footer><p>מידע שנבדק ב־02.11.2026. יש לאמת פתיחה, מחירים, הרשמה, מזג אוויר והנחיות לפני יציאה.</p><p>התמונות נטענות מקישורים חיצוניים; קרדיט אינו אישור שימוש. רישיון פרסום התמונות לא אומת. לפני הפעלת האתר הציבורי יש להסדיר הרשאות או להחליף לתמונות מורשות. תמונות אוכל ונוף אינן התחייבות לתפריט או למצב האתר במועד הביקור.</p><p>סיכומי ביקור נשמרים בנתוני המאגר לאחר עריכה ואישור. אין כאן טופס ששומר ביקורות אוטומטית.</p><a href="https://www.kkl.org.il/recreation-and-tours/messages/" target="_blank" rel="noopener">הודעות קק״ל</a></footer>'}document.getElementById('close').onclick=()=>document.getElementById('viewer').close();window.addEventListener('hashchange',()=>{render();scrollTo(0,0)});fetch('data/trips.json').then(r=>{if(!r.ok)throw Error('load');return r.json()}).then(d=>{trips=d.trips;render()}).catch(()=>{app.innerHTML='<h2>לא ניתן לטעון את הנתונים</h2><p>יש לפתוח דרך אתר או שרת מקומי, לא כקובץ HTML בודד.</p>'});</script></body></html>
