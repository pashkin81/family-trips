<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#faf8f2"><title>יוצאים לדרך · שבת מחוץ לשגרה</title><style>*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#faf8f2;color:#252a26;font:17px/1.7 Arial,sans-serif}a{color:inherit}button{font:inherit;cursor:pointer}nav{height:77px;max-width:1060px;margin:auto;padding:0 32px;display:flex;align-items:center;justify-content:space-between}.brand{text-decoration:none;font-size:23px;font-weight:800;letter-spacing:-1px}.brand span{color:#c35d39}.navlinks{display:flex;gap:23px;font-size:13px}.navlinks a{text-decoration:none;color:#75786f}main{max-width:1060px;margin:auto;padding:0 32px 45px}.hero{height:500px;position:relative;overflow:hidden;border-radius:8px;background:#687861}.hero>img{width:100%;height:100%;object-fit:cover;object-position:center 47%;position:absolute;inset:0}.hero:after{content:'';position:absolute;inset:0;background:linear-gradient(0deg,rgba(13,28,21,.86),rgba(13,28,21,.03) 85%)}.herotext{position:absolute;bottom:38px;right:40px;left:35px;color:#fff;z-index:1}.kicker{font-size:12px;letter-spacing:1.4px;color:#f6ceae}.herotext h1{font-size:clamp(45px,6.5vw,77px);letter-spacing:-2.4px;line-height:1.06;margin:13px 0 17px;max-width:660px}.herotext p{font-size:18px;margin:0;max-width:600px;color:#f1f0e8}.stamp{display:inline-block;position:absolute;top:23px;right:24px;z-index:1;background:#faf8f2ef;color:#343b30;padding:6px 12px;border-radius:4px;font-size:12px}.credit{font-size:10px;color:#87877d;margin:5px 0 10px}.credit a{text-decoration:none}.strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px;margin-top:16px}figure{margin:0}.photo{display:block;padding:0;border:0;width:100%;background:#e5e8dd;border-radius:6px;overflow:hidden}.photo img{display:block;width:100%;height:182px;object-fit:cover;transition:transform .3s}.photo:hover img{transform:scale(1.04)}figcaption{font-size:12px;margin-top:7px;color:#5b6258}figcaption b{font-weight:500;color:#b65b3d;margin-left:6px}.tripintro{padding:25px 0 30px;border-bottom:1px solid #dedfd4}.eyebrow{color:#a85134;font-size:11px;font-weight:bold;letter-spacing:1px}.tripintro h2{font-size:clamp(26px,4vw,37px);letter-spacing:-1px;line-height:1.25;margin:7px 0 10px}.tripintro p{max-width:730px;color:#6b7167;margin:0 0 15px;font-size:15px}.chips{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.chips span{border:1px solid #dcded3;padding:4px 11px;border-radius:20px;font-size:12px;color:#626b5c}.btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;background:#bf603e;color:white;padding:12px 22px;border:0;border-radius:5px;font-size:14px;gap:22px;margin:8px 0 0 7px}.secondary{background:#e8ebdf;color:#34402f}.section-title{display:flex;justify-content:space-between;align-items:baseline;margin:33px 0 15px}.section-title h2{font-size:26px;margin:0;letter-spacing:-.5px}.section-title span{font-size:12px;color:#898b80}.archive{display:block;border:1px solid #e2e3d9;border-radius:7px;background:#fffefb;padding:22px 25px;text-decoration:none;position:relative;margin:12px 0}.archive h3{font-size:22px;margin:7px 0;padding-left:20px}.archive p{font-size:14px;color:#737b6d;max-width:760px;margin:0}.archive .arrow{color:#bd603f;font-size:24px;position:absolute;left:25px;top:26px}.archive img{width:160px;height:110px;object-fit:cover;border-radius:5px;float:left;margin:0 20px 10px 0}.archive:after{content:'';display:block;clear:both}.note{font-size:11px;color:#85887c;margin-top:9px}.practical{font-size:13px;margin:24px 0;background:#f2eddf;border-right:2px solid #c19259;padding:12px 16px;border-radius:3px}summary{cursor:pointer}details p{margin:9px 0;color:#746f5d}footer{margin-top:35px;border-top:1px solid #e1e2d8;padding-top:17px;font-size:11px;color:#777c70}.back{display:inline-block;margin:20px 0;text-decoration:none;font-size:13px;color:#a35436}.routetitle{font-size:clamp(32px,5vw,49px);line-height:1.15;margin:10px 0 20px;letter-spacing:-1px}.routebanner{height:330px;width:100%;object-fit:cover;border-radius:7px}.routebar{border-bottom:1px solid #dcdfd3;padding:18px 0;font-size:14px;display:flex;gap:13px;flex-wrap:wrap}.routebar a{text-decoration:none}.routebar b{color:#ba603e;margin-left:6px}.stop{padding:28px 0;border-bottom:1px solid #dfe2d6;scroll-margin-top:20px}.stophead{display:flex;gap:16px;align-items:baseline}.stophead b{font-size:32px;color:#bd603f}.stop h2{margin:0;font-size:27px}.stop p{font-size:15px;color:#687360;max-width:800px}.gallery{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:19px 0}.gallery .photo img{height:190px}.small{font-size:12px;color:#818775}.review{padding:24px;background:#edf0e5;border-radius:6px;margin:23px 0}.review h2{margin-top:0}.review p,.review li{font-size:14px}.reviewcols{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}.review h3{font-size:15px}.review ul{padding-right:17px}dialog{border:0;padding:12px;border-radius:9px;background:#faf8f2;max-width:95vw}dialog::backdrop{background:#000d}dialog img{max-width:88vw;max-height:78vh;display:block}dialog button{border:0;background:#303f31;color:white;padding:8px 15px;margin-bottom:10px;border-radius:4px}.broken{font-size:12px;padding:15px;color:#68745d}.status{font-size:12px;color:#68745d}@media(max-width:650px){nav{height:66px;padding:0 19px}.brand{font-size:21px}.navlinks{gap:14px;font-size:11px}main{padding:0 17px 30px}.hero{height:420px;border-radius:5px}.herotext{right:24px;left:22px;bottom:29px}.herotext h1{font-size:51px;letter-spacing:-1.6px}.herotext p{font-size:15px}.stamp{top:18px;right:18px;font-size:11px}.strip{grid-template-columns:1fr 1fr;gap:10px;margin-top:11px}.strip figure:last-child{display:none}.strip .photo img{height:150px}.tripintro{padding:20px 0 25px}.tripintro h2{font-size:28px}.tripintro p{font-size:14px}.section-title{margin-top:27px}.section-title h2{font-size:23px}.archive{padding:18px}.archive h3{font-size:20px}.archive .arrow{left:17px}.archive img{width:100px;height:85px}.section-title span{font-size:11px}.gallery{grid-template-columns:1fr 1fr;gap:10px}.gallery .photo img{height:170px}.routebanner{height:230px}.stop h2{font-size:24px}.reviewcols{grid-template-columns:1fr;gap:3px}}@media print{nav,.btn{display:none}.hero{height:350px;print-color-adjust:exact}.photo img{height:130px}}</style></head><body><nav><a href="#" class="brand">יוצאים לדרך<span> ●</span></a><div class="navlinks"><a href="#">הטיול הבא</a><a href="#past">מהדרך</a></div></nav><main id="app" aria-live="polite"><p>טוענים את הטיולים…</p></main><dialog id="lightbox" aria-label="תמונה מוגדלת"><button id="close">סגירה ✕</button><img id="large" alt=""></dialog><script>let trips=[];const app=document.getElementById('app'),box=document.getElementById('lightbox');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const photos=t=>t.stops.flatMap(s=>s.photos||[]),url=t=>'#trip='+encodeURIComponent(t.id),date=t=>new Date(t.date+'T12:00:00').toLocaleDateString('he-IL',{day:'numeric',month:'long',year:'numeric'});const img=(p,lazy=true)=>p?`<img src="${esc(p.url)}" alt="${esc(p.caption)}" ${lazy?'loading="lazy"':'fetchpriority="high"'}>`:'';const fig=(p,i)=>`<figure><button class="photo" aria-label="הגדלת תמונה">${img(p)}</button><figcaption><b>${String(i+1).padStart(2,'0')}</b>${esc(p.caption)} · <a href="${esc(p.source)}" target="_blank" rel="noopener">מקור</a></figcaption></figure>`;const link=(u,t)=>`<a class="btn secondary" target="_blank" rel="noopener noreferrer" href="${esc(u)}">${esc(t)} ↗</a>`;function footer(){return '<footer>יוצאים לדרך · רעיונות לטיולים עצמאיים וסיכומים מהדרך.<details><summary>מקורות, תמונות ומידע חשוב</summary><p>נתוני התכנון המקוריים נבדקו ב־02.11.2026. יש לאמת פתיחה, מחיר, הרשמה, מזג אוויר והנחיות לפני היציאה. זמני ביקור ומעבר הם הערכות, לא ניווט חי.</p><p>תמונות חיצוניות עם קרדיט למקור. רישיונות שימוש לא אומתו; יש להסדיר הרשאות או להחליף לתמונות מורשות. התמונות אינן הבטחה לתפריט או למצב הנוף ביום הביקור. תמונות לטיולים קודמים יתווספו רק כשיש צילומים מתאימים.</p><p>ביקורות נשמרות בנתוני המאגר לאחר עריכה ואישור; אין שמירה אוטומטית מטופס.</p><a href="https://www.kkl.org.il/recreation-and-tours/messages/" target="_blank" rel="noopener">הודעות קק״ל ↗</a></details></footer>'}function card(t){return `<a class="archive" href="${url(t)}">${photos(t)[0]?img(photos(t)[0]):''}<span class="eyebrow">${esc(date(t))} · ${t.status==='completed'?'סיכום ביקור':'הצעה לטיול'}</span><h3>${esc(t.title)}</h3><p>${esc(t.summary)}</p><span class="arrow">←</span></a>`}function home(){const next=trips.filter(t=>t.status==='proposed'),past=trips.filter(t=>t.status==='completed'),t=next[0];let h='';if(t){const p=photos(t),extra=t.stops.slice(1).flatMap(s=>s.photos||[]),strip=[...extra.slice(0,2),p[1]].filter(Boolean).slice(0,3);h=`<section class="hero">${img(p[0],false)}<div class="stamp">הצעה לטיול · ${esc(date(t))}</div><div class="herotext"><span class="kicker">קצת טבע. משהו מפתיע. יום טוב.</span><h1>שבת מחוץ<br>לשגרה.</h1><p>${esc(t.title)}</p></div></section>${p[0]?`<p class="credit">צילום: <a href="${esc(p[0].source)}" target="_blank" rel="noopener">מקור התמונה</a> · התמונה אינה דיווח על מצב הנוף כעת</p>`:''}<div class="strip">${strip.map(fig).join('')}</div><section class="tripintro"><span class="eyebrow">הטיול הבא</span><h2>${esc(t.title)}</h2><p>${esc(t.summary)}</p><div class="chips"><span>${t.stops.length} תחנות</span><span>בקצב שלכם</span><span>טיול עצמאי</span></div><a class="btn" href="${url(t)}">בואו נראה את התוכנית <span>←</span></a></section>${t.notice?`<details class="practical"><summary>לפני שמתכננים: פרטים שדורשים אישור</summary><p>${esc(t.notice)}</p></details>`:''}`;}return h+next.slice(1).map(card).join('')+'<div class="section-title" id="past"><h2>טיולים קודמים</h2><span>רעיונות שכבר יצאו לדרך</span></div>'+past.map(card).join('')+footer()}function review(t){if(!t.review)return '<section class="review"><h2>אחרי שחוזרים</h2><p>טרם נוסף סיכום ביקור. זו תוכנית מוצעת, לא טיול שבוצע.</p></section>';const r=t.review;return `<section class="review"><h2>איך היה בפועל?</h2><p>${esc(r.summary)}</p><div class="reviewcols"><div><h3>מה עבד טוב</h3><ul>${r.worked.map(x=>'<li>'+esc(x)+'</li>').join('')}</ul></div><div><h3>מה פחות עבד</h3><p>${esc(r.improve||'טרם נמסר.')}</p></div><div><h3>לפעם הבאה</h3><p>${esc(r.next||'טרם נוסף מידע.')}</p></div></div></section>`}function render(){const hash=location.hash.slice(1),id=new URLSearchParams(hash).get('trip'),alias={azekah:'2026-11-07-azekah-eretz-tova',gibton:'2026-10-31-gibton-and-surroundings'},t=trips.find(x=>x.id===(id||alias[hash]));if(!id&&!alias[hash]){document.title='יוצאים לדרך · שבת מחוץ לשגרה';app.innerHTML=home();bind();if(hash==='past')requestAnimationFrame(()=>document.getElementById('past')?.scrollIntoView());return}if(!t){app.innerHTML='<h1>הטיול לא נמצא</h1><a href="#">חזרה לארכיון</a>';return}document.title=t.title+' · יוצאים לדרך';app.innerHTML=`<a class="back" href="#">→ חזרה לכל הטיולים</a><div class="eyebrow">${esc(date(t))} · ${t.status==='completed'?'סיכום ביקור':'הצעה לטיול'}</div><h1 class="routetitle">${esc(t.title)}</h1><p>${esc(t.summary)}</p>${photos(t)[0]?img(photos(t)[0],false).replace('<img ','<img class="routebanner" '):''}<div class="routebar">${t.stops.map((s,i)=>`<a href="#stop-${i}" data-stop="stop-${i}"><b>${String(i+1).padStart(2,'0')}</b>${esc(s.name)}</a>`).join('')}</div>${t.notice?`<aside class="practical">${esc(t.notice)}</aside>`:''}${t.stops.map((s,i)=>`<section class="stop" id="stop-${i}"><div class="stophead"><b>${String(i+1).padStart(2,'0')}</b><h2>${esc(s.name)}</h2></div><p>${esc(s.description)}</p>${s.duration?`<p class="small">${esc(s.duration)}</p>`:''}${s.photos?.length?'<div class="gallery">'+s.photos.map(fig).join('')+'</div>':''}${link('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(s.map),'ניווט')}${s.website?link(s.website,'אתר המקום'):''}</section>`).join('')}${t.transfers?.length?'<p class="small">'+t.transfers.map(esc).join('<br>')+' · הערכות בלבד.</p>':''}${review(t)}<button class="btn" id="share">שיתוף הטיול ↗</button><span id="status" class="status"></span>${footer()}`;bind();document.querySelectorAll('[data-stop]').forEach(a=>a.onclick=e=>{e.preventDefault();document.getElementById(a.dataset.stop).scrollIntoView({behavior:'smooth'})});document.getElementById('share').onclick=async()=>{try{if(navigator.share)await navigator.share({title:t.title,url:location.href});else{await navigator.clipboard.writeText(location.href);document.getElementById('status').textContent=' הקישור הועתק'}}catch(e){if(e.name!=='AbortError')document.getElementById('status').textContent=' אפשר להעתיק את כתובת הדף ידנית'}}}function bind(){document.querySelectorAll('.photo').forEach(b=>b.onclick=()=>{const i=b.querySelector('img');if(!i||i.hidden)return;const l=document.getElementById('large');l.src=i.src;l.alt=i.alt;box.showModal()});document.querySelectorAll('#app img').forEach(i=>i.addEventListener('error',()=>{i.hidden=true;const p=document.createElement('span');p.className='broken';p.textContent='התמונה אינה זמינה כרגע';i.after(p)}))}document.getElementById('close').onclick=()=>box.close();box.onclick=e=>{if(e.target===box)box.close()};addEventListener('hashchange',()=>{render();if(location.hash!=='#past')scrollTo(0,0)});fetch('data/trips.json').then(r=>{if(!r.ok)throw Error('load');return r.json()}).then(d=>{trips=d.trips;render()}).catch(()=>{app.innerHTML='<h1>לא ניתן לטעון את הטיולים</h1><p>נסו לרענן. לפתיחה מקומית נדרש שרת HTTP.</p>'});</script></body></html>
