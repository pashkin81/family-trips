<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#faf8f3"><title>יוצאים לדרך · קצת מחוץ לשגרה</title><style>*{box-sizing:border-box}body{margin:0;background:#faf8f3;color:#242b29;font:17px/1.75 Arial,sans-serif}a{color:inherit}button{font:inherit;cursor:pointer}nav{max-width:1180px;margin:auto;padding:19px 24px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #e4e2da}nav a{text-decoration:none}.brand{font-size:23px;font-weight:800}.brand i{color:#c5633f;font-style:normal}nav span{font-size:13px;color:#737a73}main{max-width:1180px;margin:auto;padding:28px 24px 60px}.eyebrow{font-size:12px;letter-spacing:1px;color:#a95031;font-weight:bold}.intro{margin-bottom:22px}.intro h1{font-size:clamp(35px,5vw,60px);line-height:1.12;letter-spacing:-1.7px;margin:9px 0}.muted{color:#72796f;font-size:14px}.feature{display:grid;grid-template-columns:1.35fr 1fr;gap:0;border-radius:24px;overflow:hidden;background:#eee9df;margin-bottom:16px}.cover{position:relative;min-height:430px;background:#d3dacc;overflow:hidden}.cover>img{position:absolute;width:100%;height:100%;object-fit:cover}.shade{position:absolute;inset:0;background:linear-gradient(0deg,#142821c9,transparent 75%)}.covertext{position:absolute;bottom:27px;right:28px;left:25px;color:white}.covertext h2{font-size:clamp(30px,4vw,46px);line-height:1.15;margin:10px 0}.pill{display:inline-block;font-size:12px;border-radius:20px;padding:5px 11px;background:#fff;color:#344139}.featurecopy{padding:33px;display:flex;flex-direction:column;justify-content:center}.featurecopy h2{font-size:29px;line-height:1.25;margin:10px 0}.btn{display:inline-block;align-self:start;border:0;border-radius:9px;background:#bf5c39;color:white;text-decoration:none;padding:11px 20px;font-size:15px;margin:10px 0 0 7px}.light{background:#e9ece3;color:#35443b}.chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.chips span{font-size:12px;border:1px solid #d4d8cf;border-radius:20px;padding:4px 11px}.teasers{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.teasers img{height:125px;width:100%;object-fit:cover;border-radius:12px}.sectionhead{display:flex;justify-content:space-between;align-items:baseline;margin:37px 0 16px}.sectionhead h2{font-size:27px;margin:0}.archive{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.archive article{border:1px solid #e4e5dc;background:white;border-radius:18px;overflow:hidden}.archive img{height:210px;width:100%;object-fit:cover}.archive .body{padding:22px}.archive h3{font-size:23px;margin:8px 0}.art{height:160px;display:flex;align-items:center;justify-content:center;background:#e8e8d8;font-size:20px;letter-spacing:6px;color:#64725c}.triphead h1{font-size:clamp(34px,5vw,58px);line-height:1.17;max-width:850px;margin:12px 0}.triphead p{max-width:740px}.mosaic{display:grid;grid-template-columns:2fr 1fr;gap:10px;margin:25px 0;border-radius:22px;overflow:hidden}.mosaic img{width:100%;height:360px;object-fit:cover}.mosaic div{display:grid;gap:10px}.mosaic div img{height:175px}.notice{border-right:3px solid #ca8e4c;background:#f6eddd;padding:15px 18px;font-size:14px;border-radius:8px;margin:25px 0}.routebar{display:flex;flex-wrap:wrap;gap:10px;margin:25px 0;padding:18px 0;border-block:1px solid #e2e4d8}.routebar a{text-decoration:none;font-size:14px}.routebar b{color:#bb5b38;margin-left:5px}.stop{position:relative;border-top:1px solid #e1e3da;padding:30px 0;margin-top:24px}.stophead{display:flex;gap:18px;align-items:baseline}.number{color:#be5d39;font-size:37px;line-height:1;font-weight:bold}.stop h2{font-size:30px;margin:0}.stop p{max-width:790px}.gallery{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:22px 0}.gallery figure{margin:0}.photo{padding:0;border:0;background:#e5e9df;width:100%;border-radius:12px;overflow:hidden}.photo img{width:100%;height:190px;object-fit:cover;display:block;transition:transform .25s}.photo:hover img{transform:scale(1.04)}figcaption{font-size:11px;color:#758071;padding-top:5px}.review{background:#eef0e6;border-radius:18px;padding:26px;margin:30px 0}.review h2{margin-top:0}.reviewgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:25px}.review h3{font-size:15px}.review p,.review li{font-size:14px}.review ul{padding-right:18px}.small{font-size:13px;color:#737c70}footer{border-top:1px solid #dedfd5;padding-top:20px;margin-top:45px;color:#727a6f;font-size:12px}footer details{margin-top:12px}footer summary{cursor:pointer}dialog{border:0;border-radius:16px;background:#faf8f3;max-width:95vw;padding:12px}dialog::backdrop{background:#000d}dialog img{max-width:87vw;max-height:78vh;display:block}dialog button{margin:0 0 10px}.back{text-decoration:none;font-size:14px}.shareline{display:flex;gap:10px;align-items:center}@media(max-width:720px){nav{padding:15px 18px}nav span{font-size:11px}main{padding:23px 18px 45px}.feature{grid-template-columns:1fr}.cover{min-height:310px}.featurecopy{padding:24px}.covertext{right:23px;bottom:24px}.featurecopy h2{font-size:25px}.teasers img{height:130px}.archive{grid-template-columns:1fr}.mosaic{grid-template-columns:1.4fr 1fr}.mosaic img{height:260px}.mosaic div img{height:125px}.gallery{grid-template-columns:1fr 1fr;gap:10px}.photo img{height:170px}.reviewgrid{grid-template-columns:1fr;gap:4px}.stop h2{font-size:25px}.sectionhead{align-items:center}.sectionhead .muted{font-size:12px}.intro h1{letter-spacing:-1px}.triphead h1{letter-spacing:-1px}}@media print{nav,.btn,.shareline{display:none}.feature,.mosaic{break-inside:avoid}.photo img{height:130px}}</style></head><body><nav><a class="brand" href="#">יוצאים לדרך<i> ●</i></a><span>קצת טבע. משהו מפתיע. יום טוב.</span></nav><main id="app" aria-live="polite"><p>רגע, אוספים את המקומות…</p></main><dialog id="viewer" aria-label="תמונה מוגדלת"><button class="btn" id="close">סגירה ✕</button><img id="large" alt=""></dialog><script>const app=document.getElementById('app');let trips=[];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const allPhotos=t=>t.stops.flatMap(s=>s.photos||[]);const href=t=>'#trip='+encodeURIComponent(t.id);const date=t=>new Date(t.date+'T12:00:00').toLocaleDateString('he-IL',{day:'numeric',month:'long',year:'numeric'});const image=(p,cls='')=>p?`<img class="${cls}" src="${esc(p.url)}" alt="${esc(p.caption)}" loading="lazy" onerror="this.hidden=true">`:'';const link=(u,t)=>`<a class="btn light" target="_blank" rel="noopener noreferrer" href="${esc(u)}">${esc(t)} ↗</a>`;function feature(t){const p=allPhotos(t),extra=t.stops.slice(1).flatMap(s=>s.photos||[]);return `<article class="feature"><a class="cover" href="${href(t)}">${image(p[0])}<div class="shade"></div><div class="covertext"><span class="pill">הצעה לטיול · ${esc(date(t))}</span><h2>${esc(t.title)}</h2></div></a><div class="featurecopy"><span class="eyebrow">הטיול הבא מתחיל כאן</span><h2>נוף פתוח.<br>משהו אחר בהמשך.</h2><p>${esc(t.summary)}</p><div class="chips"><span>${t.stops.length} תחנות</span><span>בקצב שלכם</span><span>טיול עצמאי</span></div><a class="btn" href="${href(t)}">בואו נראה את התוכנית ←</a><div class="teasers">${extra.slice(0,2).map(p=>image(p)).join('')}</div></div></article>`}function cards(ts){return '<div class="archive">'+ts.map(t=>`<article>${allPhotos(t)[0]?image(allPhotos(t)[0]):'<div class="art" aria-label="טרם נוספה תמונת שער">טבע / קפה / גילויים</div>'}<div class="body"><span class="eyebrow">${esc(date(t))} · ${t.status==='completed'?'סיכום ביקור':'רעיון לטיול'}</span><h3>${esc(t.title)}</h3><p class="muted">${esc(t.summary)}</p><a class="btn light" href="${href(t)}">${t.status==='completed'?'למסלול ולחוויות':'לתוכנית'} ←</a></div></article>`).join('')+'</div>'}function footer(){return '<footer>יוצאים לדרך · רעיונות לטיולים עצמאיים וסיפורים מהדרך.<details><summary>מקורות, תמונות ופרטים שחשוב לדעת</summary><p>נתוני התכנון המקוריים נבדקו ב־02.11.2026. יש לאמת פתיחה, מחירים, הרשמה, מזג אוויר והנחיות סמוך ליציאה. זמני ביקור ומעברים הם הערכות בלבד.</p><p>התמונות מקושרות למקורות חיצוניים, עם קרדיט בגלריות. רישיונות הפרסום לא אומתו; יש להסדיר הרשאה או להחליף לתמונות מורשות. התמונות אינן התחייבות לתפריט, פריחה או מצב היעד ביום הביקור. למקומות ללא תמונות אין תמונת אילוסטרציה שמוצגת כצילום אמיתי.</p><p>ביקורות מתעדכנות דרך נתוני המאגר, לא באמצעות טופס באתר.</p><a href="https://www.kkl.org.il/recreation-and-tours/messages/" target="_blank" rel="noopener">הודעות קק״ל ↗</a></details></footer>'}function review(t){if(!t.review)return '<section class="review"><span class="eyebrow">אחרי שחוזרים</span><h2>הסיפור עוד לפנינו</h2><p>זהו רעיון לטיול, לא ביקור מתועד. בהמשך יופיעו כאן החוויות והדברים שכדאי לדעת לפעם הבאה.</p></section>';const r=t.review;return `<section class="review"><span class="eyebrow">מבט לאחור</span><h2>איך היה בפועל?</h2><p>${esc(r.summary)}</p><div class="reviewgrid"><div><h3>מה עבד טוב</h3><ul>${r.worked.map(x=>'<li>'+esc(x)+'</li>').join('')}</ul></div><div><h3>מה פחות עבד</h3><p>${esc(r.improve||'טרם נמסר.')}</p></div><div><h3>לפעם הבאה</h3><p>${esc(r.next||'טרם נוספו המלצות.')}</p></div></div></section>`}function render(){const id=new URLSearchParams(location.hash.slice(1)).get('trip'),t=trips.find(x=>x.id===id);if(!id){document.title='יוצאים לדרך · קצת מחוץ לשגרה';const next=trips.filter(x=>x.status==='proposed'),past=trips.filter(x=>x.status==='completed');app.innerHTML='<section class="intro"><span class="eyebrow">מקומות ששווה לצאת בשבילם</span><h1>שבת מחוץ לשגרה.</h1><p class="muted">קצת נוף, עצירה מפתיעה ותוכנית שמשאירה מקום לחשק.</p></section>'+(next[0]?feature(next[0]):'')+(next.length>1?cards(next.slice(1)):'')+'<div class="sectionhead"><h2>כבר יצאנו לדרך</h2><span class="muted">מסלולים וחוויות מהעבר</span></div>'+cards(past)+footer();return}if(!t){app.innerHTML='<h1>הטיול לא נמצא</h1><a href="#">חזרה לכל הטיולים</a>';return}document.title=t.title+' · יוצאים לדרך';const p=allPhotos(t),extras=t.stops.slice(1).flatMap(s=>s.photos||[]),sides=extras.length?extras:p.slice(1);app.innerHTML=`<a class="back" href="#">→ לכל הטיולים</a><section class="triphead"><p class="eyebrow">${esc(date(t))} · ${t.status==='completed'?'יומן מסע':'הצעה לטיול עצמאי'}</p><h1>${esc(t.title)}</h1><p>${esc(t.summary)}</p></section>${p.length?`<div class="mosaic">${image(p[0])}<div>${sides.slice(0,2).map(x=>image(x)).join('')}</div></div>`:''}<div class="routebar">${t.stops.map((s,i)=>`<a href="#stop-${i}" data-stop="stop-${i}"><b>${String(i+1).padStart(2,'0')}</b>${esc(s.name)}${i<t.stops.length-1?' ←':''}</a>`).join('')}</div>${t.notice?`<aside class="notice">${esc(t.notice)}</aside>`:''}${t.stops.map((s,i)=>`<section class="stop" id="stop-${i}"><div class="stophead"><span class="number">${String(i+1).padStart(2,'0')}</span><h2>${esc(s.name)}</h2></div><p>${esc(s.description)}</p>${s.duration?`<p class="small">${esc(s.duration)}</p>`:''}${link('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(s.map),'פותחים ניווט')}${s.website?link(s.website,'אתר המקום'):''}${s.photos?.length?'<div class="gallery">'+s.photos.map(ph=>`<figure><button class="photo" aria-label="הגדלת תמונה">${image(ph)}</button><figcaption>${esc(ph.caption)} · <a target="_blank" rel="noopener noreferrer" href="${esc(ph.source)}">מקור</a></figcaption></figure>`).join('')+'</div>':''}</section>`).join('')}${t.transfers?.length?'<section class="stop"><h2>בין התחנות</h2><p>'+t.transfers.map(esc).join('<br>')+'</p><p class="small">הערכות בלבד, לא ניווט בזמן אמת.</p></section>':''}${review(t)}<div class="shareline"><button class="btn" id="share">שולחים את הטיול ↗</button><span id="status" class="small"></span></div>${footer()}`;document.querySelectorAll('[data-stop]').forEach(a=>a.onclick=e=>{e.preventDefault();document.getElementById(a.dataset.stop).scrollIntoView({behavior:'smooth',block:'start'})});document.querySelectorAll('.photo').forEach(b=>b.onclick=()=>{const im=b.querySelector('img');if(!im||im.hidden)return;const l=document.getElementById('large');l.src=im.src;l.alt=im.alt;document.getElementById('viewer').showModal()});document.getElementById('share').onclick=async()=>{try{if(navigator.share)await navigator.share({title:t.title,url:location.href});else{await navigator.clipboard.writeText(location.href);document.getElementById('status').textContent='הקישור הועתק'}}catch(e){if(e.name!=='AbortError')document.getElementById('status').textContent='אפשר להעתיק את כתובת הדף ולשלוח'}}}document.getElementById('close').onclick=()=>document.getElementById('viewer').close();document.getElementById('viewer').addEventListener('click',function(e){if(e.target===this)this.close()});window.addEventListener('hashchange',()=>{render();scrollTo(0,0)});fetch('data/trips.json').then(r=>{if(!r.ok)throw Error('load');return r.json()}).then(d=>{trips=d.trips;render()}).catch(()=>{app.innerHTML='<h1>לא הצלחנו לטעון את הטיולים</h1><p>נסו לרענן. לפתיחה מקומית נדרש שרת HTTP.</p>'});</script></body></html>
