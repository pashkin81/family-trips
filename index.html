map).join('|'));return 'https://www.google.com/maps/dir/?'+q}function maphtml(t){return `<section class="mapwrap"><div class="mapintro"><h2>הטיול על המפה</h2><p class="small">מיקומי האתרים, לא חניונים או הוראות גישה. אין כאן קו נהיגה מחושב.</p></div><div id="tripmap" class="tripmap" role="region" aria-label="מפת תחנות הטיול"><p>טוענים מפה…</p></div><div class="maplist"><ol>${t.stops.map(s=>`<li>${esc(s.name)}${!s.coords?' — מיקום מדויק לא אומת; לא הוצבה סיכה':''}</li>`).join('')}</ol>${link(fullroute(t),'למסלול המלא ב־Google Maps')}<p class="small">התחנות נשמרות לפי סדר הביקור. Google Maps מחשב את הדרך; יש לבדוק כל יעד וחניה לפני היציאה.</p></div></section>`}let leafletPromise;function leaflet(){if(window.L)return Promise.resolve();if(!leafletPromise)leafletPromise=new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';s.onload=resolve;s.onerror=reject;document.head.appendChild(s)});return leafletPromise}async function mountmap(t){const el=document.getElementById('tripmap');if(!el)return;try{await leaflet();if(!el.isConnected)return;el.textContent='';const m=L.map(el,{scrollWheelZoom:false});mapInstance=m;L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'}).addTo(m);const pts=[];t.stops.forEach((s,i)=>{if(!s.coords)return;pts.push(s.coords);const popup=document.createElement('div'),title=document.createElement('strong'),a=document.createElement('a');title.textContent=(i+1)+'. '+s.name;a.textContent='פתיחת האתר במפות';a.href='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(s.map);a.target='_blank';a.rel='noopener';popup.append(title,document.createElement('br'),a);L.marker(s.coords,{icon:L.divIcon({className:'pin',html:'<span>'+(i+1)+'</span>',iconSize:[30,30],iconAnchor:[15,15]})}).addTo(m).bindPopup(popup)});if(pts.length)m.fitBounds(L.latLngBounds(pts),{padding:[35,35],maxZoom:14});else m.setView([31.85,34.9],10);setTimeout(()=>{if(el.isConnected)m.invalidateSize()},100)}catch(e){if(el.isConnected)el.textContent='המפה לא נטענה. אפשר לפתוח את המסלול המלא בכפתור למטה.'}}function footer(){return '<footer>יוצאים לדרך · רעיונות וסיכומים מהדרך.<details><summary>מקורות, מפות ותמונות</summary><p>תמונות ממקורות חיצוניים, לא צילומים מהביקור. רישיונות שימוש לא אומתו; יש להסדיר הרשאות או להשתמש בתמונות מורשות. התמונות אינן אישור לתפריט, עונה או מצב המקום.</p><p>מפות: Leaflet ו־OpenStreetMap. נקודות ציון: רישומי מקומות; גיבתון לפי iNature. סיכות הן מיקומי אתרים, לא חניות. המסלול המלא מחושב מחוץ לאתר ב־Google Maps.</p><p>יש לבדוק פתיחה, מזג אוויר, מחירים והנחיות סמוך ליציאה. סיכומי ביקור נשמרים במאגר; אין טופס שמירה אוטומטי.</p><a href="https://www.kkl.org.il/recreation-and-tours/messages/">הודעות קק״ל</a> · <a href="https://trucksmuseum.org.il/">אתר המוזיאון</a> · <a href="https://inature.info/wiki/שמורת_מעיינות_גיבתון">iNature גיבתון</a></details></footer>'}function card(t){return `<a class="archive" href="${url(t)}"><div class="archive-copy"><span class="eyebrow">${esc(date(t))} · ${t.status==='completed'?'סיכום ביקור':'הצעה לטיול'}</span><h3>${esc(t.title)}</h3><p>${esc(t.summary)}</p><span class="archive-read">למסלול, לתמונות ולמפה ←</span></div>${photos(t)[0]?img(photos(t)[0]):''}</a>`}const heroPhotos=[{url:'https://d2u1z1lopyfwlx.cloudfront.net/thumbnails/864ad426-ae1c-5b2d-9a19-42cfc17c4acf/bfc8b3fb-df3f-579b-adb7-fc7e06e93860.jpg',caption:'נוף עמק האלה מתל עזקה — צילום חיצוני',source:'https://baliletayel.co.il/israeltrip/תל-עזקה-תצפית-מרהיבה-על-השפלה/'},{url:'https://d2u1z1lopyfwlx.cloudfront.net/thumbnails/7f39e9d0-cc49-5ef0-921d-9c1d0ff3726a/bfc8b3fb-df3f-579b-adb7-fc7e06e93860.jpg',caption:'מינה טראק בחולדה — צילום חיצוני',source:'https://baliletayel.co.il/rest/מינה-טראק-עגלת-קפה-בתוך-יער-חולדה/'},{url:'https://d2u1z1lopyfwlx.cloudfront.net/thumbnails/4986d278-d3fb-5168-9602-dcadcf9bd0b8/bfc8b3fb-df3f-579b-adb7-fc7e06e93860.jpg',caption:'עתיקות בתל עזקה — צילום חיצוני',source:'https://baliletayel.co.il/israeltrip/תל-עזקה-תצפית-מרהיבה-על-השפלה/'}];function home(){const next=trips.filter(t=>t.status==='proposed').sort((a,b)=>a.date.localeCompare(b.date)),past=trips.filter(t=>t.status==='completed').sort((a,b)=>b.date.localeCompare(a.date)),last=past[0];return `<section class="chero" aria-labelledby="headline"><div class="cinner"><div class="ccopy"><div class="ckicker">לא רחוק מהשגרה. לגמרי מחוץ לה.</div><h1 id="headline">קצת לצאת.<br>הרבה לגלות.</h1><p>מסלולים עצמאיים, עצירות מפתיעות<br>ומקומות ששווה לצאת בשבילם.</p><div class="cactions"><a class="cbutton" href="#past">לגלות את הטיולים ←</a>${last?`<a class="ctextlink" href="${url(last)}">מהטיול האחרון ←</a>`:''}</div></div><div class="collage" aria-label="רגעים מהדרך — תמונות להמחשה"><span class="cvertical" aria-hidden="true">יוצאים לדרך / רגעים קטנים בחוץ</span>${heroPhotos.map((p,i)=>`<figure class="cpicture ${['clandscape','ccoffee','cruins'][i]}">${img(p,false)}<figcaption>${['קצת מרחב · תל עזקה','משהו טוב בדרך · קפה בחוץ','עוד משהו לגלות · עתיקות'][i]}</figcaption></figure>`).join('')}</div></div><div class="cherofoot"><span>טיולים עצמאיים</span><span>מפות ותחנות בדרך</span><span>חוויות שחוזרים איתן</span></div></section><div class="homebody">${last?`<section class="latest" id="latest"><span class="label">האחרון מהדרך<span class="date-separator">·</span>${esc(date(last))}</span><div><h2>${esc(last.title)}</h2><p>${esc(last.summary)}</p></div><a href="${url(last)}">לסיכום הטיול ←</a></section>`:'<div id="latest"></div>'}<details class="homecredits"><summary>תמונות הפתיחה · מקורות חיצוניים להמחשה</summary><p>לא צילומים מהביקורים. הרשאות השימוש טרם אומתו.</p>${heroPhotos.map(p=>`<a href="${esc(p.source)}" target="_blank" rel="noopener">${esc(p.caption)}</a>`).join('')}</details>${next.length?'<div class="section-title"><h2>על הפרק</h2><span>הצעות לטיול</span></div>'+next.map(card).join(''):''}<div class="section-title" id="past"><h2>טיולים קודמים</h2><span>מסלולים, מפות וחוויות</span></div>${past.map(card).join('')}${footer()}</div>`}function review(t){if(!t.review)return '<section class="review"><h2>אחרי שחוזרים</h2><p>טרם נוסף סיכום ביקור. זו תוכנית מוצעת.</p></section>';const r=t.review;return `<section class="review"><h2>איך היה בפועל?</h2><p>${esc(r.summary)}</p><div class="reviewcols"><div><h3>מה עבד</h3><ul>${r.worked.map(x=>'<li>'+esc(x)+'</li>').join('')}</ul></div><div><h3>מה פחות עבד</h3><p>${esc(r.improve||'טרם נמסר.')}</p></div><div><h3>לפעם הבאה</h3><p>${esc(r.next||'טרם נמסר.')}</p></div></div></section>`}function render(){if(mapInstance){mapInstance.remove();mapInstance=null}const hash=location.hash.slice(1),id=new URLSearchParams(hash).get('trip'),alias={azekah:'2026-11-07-azekah-eretz-tova',gibton:'2026-10-31-gibton-and-surroundings'},t=trips.find(x=>x.id===(id||alias[hash]));app.classList.toggle('homepage',!id&&!alias[hash]);if(!id&&!alias[hash]){document.title='יוצאים לדרך · שבת מחוץ לשגרה';app.innerHTML=home();bind();if(hash==='past'||hash==='latest')requestAnimationFrame(()=>document.getElementById(hash)?.scrollIntoView());return}if(!t){app.innerHTML='<h1>הטיול לא נמצא</h1><a href="#">חזרה</a>';return}document.title=t.title+' · יוצאים לדרך';app.innerHTML=`<a class="back" href="#">→ חזרה לכל הטיולים</a><div class="eyebrow">${esc(date(t))} · ${t.status==='completed'?'סיכום ביקור':'הצעה לטיול'}</div><h1 class="routetitle">${esc(t.title)}</h1><p>${esc(t.summary)}</p>${photos(t)[0]?img(photos(t)[0],false).replace('<img ','<img class="routebanner" '):''}${maphtml(t)}${t.notice?`<aside class="practical">${esc(t.notice)}</aside>`:''}<div class="routebar">${t.stops.map((s,i)=>`<a href="#stop-${i}" data-stop="stop-${i}"><b>${i+1}</b> ${esc(s.name)}</a>`).join('')}</div>${t.stops.map((s,i)=>`<section class="stop" id="stop-${i}"><div class="stophead"><b>${String(i+1).padStart(2,'0')}</b><h2>${esc(s.name)}</h2></div><p>${esc(s.description)}</p>${s.duration?`<p class="small">${esc(s.duration)}</p>`:''}${s.photos?.length?'<div class="gallery">'+s.photos.map(fig).join('')+'</div>':'<p class="small">טרם נוספו תמונות מזוהות מתאימות לתחנה הזו.</p>'}${link('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(s.map),'ניווט')}${s.website?link(s.website,'אתר המקום'):''}</section>`).join('')}${t.transfers?.length?'<p class="small">'+t.transfers.map(esc).join('<br>')+' · הערכות בלבד.</p>':''}${review(t)}<button class="btn" id="share">שיתוף הטיול ↗</button><span id="status" class="status"></span>${footer()}`;bind();mountmap(t);document.querySelectorAll('[data-stop]').forEach(a=>a.onclick=e=>{e.preventDefault();document.getElementById(a.dataset.stop).scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'})});document.getElementById('share').onclick=async()=>{try{if(navigator.share)await navigator.share({title:t.title,url:location.href});else{await navigator.clipboard.writeText(location.href);document.getElementById('status').textContent=' הקישור הועתק'}}catch(e){if(e.name!=='AbortError')document.getElementById('status').textContent=' אפשר להעתיק את הקישור ידנית'}}}function bind(){document.querySelectorAll('.photo').forEach(b=>b.onclick=()=>{const i=b.querySelector('img');if(!i||i.hidden)return;const l=document.getElementById('large');l.src=i.src;l.alt=i.alt;box.showModal()});document.querySelectorAll('#app img').forEach(i=>{const fail=()=>{if(i.dataset.failed)return;i.dataset.failed='1';i.hidden=true;const p=document.createElement('span');p.className='small';p.textContent='התמונה אינה זמינה כרגע';i.after(p)};i.addEventListener('error',fail);if(i.complete&&!i.naturalWidth)fail()})}document.getElementById('close').onclick=()=>box.close();box.onclick=e=>{if(e.target===box)box.close()};addEventListener('hashchange',()=>{render();if(!['#past','#latest'].includes(location.hash))scrollTo(0,0)});fetch('data/trips.json').then(r=>{if(!r.ok)throw Error('load');return r.json()}).then(d=>{trips=d.trips;enrich();render()}).catch(()=>{app.innerHTML='<h1>לא ניתן לטעון את הטיולים</h1><p>נסו לרענן. לפתיחה מקומית נדרש שרת HTTP.</p>'});</script></body></html>
